<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <style>
        /* CSS Variables for easy color adjustments */
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-start: #38bdf8;
            --accent-end: #818cf8;
        }

        /* Base Reset and Body Styling */
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.05), transparent 25%);
        }

        /* Container for Main Content */
        .container {
            z-index: 10;
            padding: 2rem;
            animation: fadeIn 1.5s ease-in-out;
        }

        /* Typography */
        h1 {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            background: linear-gradient(to right, var(--accent-start), var(--accent-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            letter-spacing: 1px;
            font-weight: 300;
        }

        /* Animated Loader */
        .loader {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 3rem;
        }

        .dot {
            width: 16px;
            height: 16px;
            background: linear-gradient(to bottom right, var(--accent-start), var(--accent-end));
            border-radius: 50%;
            animation: bounce 1.5s infinite ease-in-out both;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .dot:nth-child(1) { animation-delay: -0.30s; }
        .dot:nth-child(2) { animation-delay: -0.15s; }

        /* Animations */
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 24px;
            font-size: 0.9rem;
            color: #475569;
            letter-spacing: 0.5px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            p { font-size: 1.1rem; }
        }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <div class="container">
        <h1>Basant Koiri</h1>
        <p>Wonderful projects are loading...</p>
        
        <div class="loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 basantkoiri.com.np. All rights reserved.
    </div>
  </body>
</html>
